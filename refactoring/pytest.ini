# 생성 시간: Thu Sep  4 08:17:51 KST 2025
# 핵심 내용: 리팩터링 프로젝트 TDD를 위한 pytest 설정
# 상세 내용:
#   - testpaths: tests 디렉터리 설정
#   - python_files: test_*.py 패턴
#   - python_classes: Test* 클래스 패턴
#   - markers: 테스트 유형별 마커 설정 (solitary_unit, social_unit, integration)
#   - addopts: 실행 옵션 (-v: verbose, --tb=short: 짧은 traceback)
# 상태: active
# 주소: pytest_config
# 참조: N/A

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 테스트 유형별 마커 정의
markers =
    solitary_unit: 격리된 단위 테스트 (외부 의존성 없음)
    social_unit: 사회적 단위 테스트 (내부 의존성 포함)
    integration: 통합 테스트 (외부 시스템 연동)
    slow: 시간이 오래 걸리는 테스트

# pytest 실행 옵션
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# 로그 설정
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S