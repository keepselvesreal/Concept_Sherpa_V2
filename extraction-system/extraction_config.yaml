# 추출 시스템 통합 설정 파일
# 기존 추출 작업 + 새로운 책 파이프라인 통합

# 기존 추출 작업 설정 (유튜브, 마크다운)
extraction:
  ai_provider: "claude"  # claude, gemini, openai
  
  fallback:
    max_attempts: 3
    retry_delay_base: 1.0  # 지수 백오프 기본값 (초)
    timeout_seconds: 30
    default_language: "korean"  # source_language 감지 실패 시 기본값
  
  tasks:
    core_content:
      enabled: true
      max_sentences: 3
    detailed_core_content:
      enabled: true
      max_words: 300
    detailed_content:
      enabled: true
      # max_words 제한 없음 - 자유로운 상세 내용 추출
    main_topics:
      enabled: true
      max_items: 5
    sub_topics:
      enabled: true
      max_items: 5

# AI 모델별 설정
providers:
  claude:
    max_turns: 1
    temperature: 0.7
    allowed_tools: []
  gemini:
    api_key_env: "GEMINI_API_KEY"
    model: "models/gemini-2.0-flash"  # models/gemini-2.0-flash 사용
    temperature: 0.7
    # 대안 모델 설정
    lite_model: "gemini-2.5-flash-lite"  # 빠른 분석용 가벼운 모델
    experimental_model: "gemini-2.0-flash-exp"  # 실험용 모델
  openai:
    api_key_env: "OPENAI_API_KEY" 
    model: "gpt-4"
    temperature: 0.7

# 책 파이프라인 전용 설정 (PDF/EPUB → 통합 노드 문서)
book_pipeline:
  # 1단계: PDF 목차 추출 설정
  toc_extractor:
    ai_provider: "claude"  # 목차 추출은 정확성이 중요하므로 Claude 사용
    max_retries: 2  # 실패 시 재시도 횟수
    processing_mode: "hierarchical"  # 계층 구조 처리 모드
    
  # 2단계: 장별 폴더 생성 설정  
  chapter_extractor:
    ai_provider: "gemini"  # 빠른 분류 작업에 적합
    temperature: 0.5  # 균형있는 온도 설정
    max_retries: 3
    batch_processing: true  # 배치 처리 활성화
    
  # 3단계: 콘텐츠 노드 분석 설정 (has_content 필드 추가)
  content_node_analyzer:
    ai_provider: "gemini"  # has_content 식별용 AI 제공자 (빠른 분석)
    model: "gemini-2.5-flash-lite"  # 가벼운 모델로 빠른 분석
    temperature: 0.3  # 낮은 온도로 일관성 있는 판단
    max_retries: 2
    timeout_seconds: 15  # 빠른 응답을 위한 타임아웃
    batch_size: 5  # 배치 처리 크기
    
  # 4단계: 실제 콘텐츠 추출 설정
  content_extractor:
    ai_provider: "gemini"  # 콘텐츠 추출용 AI 제공자 (gemini-2.5-flash-lite 사용)
    model: "gemini-2.5-flash-lite"  # 빠른 콘텐츠 추출용 가벼운 모델
    temperature: 0.7  # 적당한 온도로 자연스러운 추출
    max_retries: 2
    output_format: "markdown"  # 출력 형식
    include_page_numbers: true  # 페이지 번호 포함 여부
    
  # 전역 설정
  global:
    output_base_dir: "./book_outputs"  # 책 파이프라인 출력 기본 경로
    temp_cleanup: true  # 임시 파일 자동 정리
    create_backup: false  # 백업 파일 생성 여부
    
  # 처리 옵션
  processing:
    parallel_chapters: false  # 장별 병렬 처리 (메모리 사용량 고려)
    max_chapter_size_mb: 50  # 장별 최대 크기 제한 (MB)
    extract_images: false  # 이미지 추출 여부 (1단계에서는 비활성화)

# unified_node_processor_v4.py 설정 (노드 정보 문서 추출/업데이트용)
unified_node_processor:
  ai_provider: "gemini"  # AI 제공자 선택
  model: "models/gemini-2.0-flash"  # 추출/업데이트 작업용 모델
  processing_mode: "v5"  # 처리 모드 (v1, v2, v3, v5)
  debug_dir: "./logs"  # 디버그 로그 폴더 경로 (상대 경로, 실행 시 동적 설정됨)
  # 아래 경로들은 book_pipeline_v3.py에서 각 장별로 동적 설정됨
  nodes_json_path: ""  # 동적 설정: {chapter_folder}/{chapter}_toc.json
  node_docs_dir: ""    # 동적 설정: {chapter_folder}/node_info_docs
  
  # 병렬 처리 설정
  parallel:
    max_concurrent: 3
    
  # 로깅 설정
  logging:
    level: 'INFO'
    save_logs: true

# chapter_toc_generator.py 설정 (enhanced_chapter_toc.md 생성용)
chapter_toc_generator:
  output_filename_pattern: "enhanced_{title}_toc.md"  # 출력 파일명 패턴
  include_empty_sections: false  # 빈 추출 섹션 포함 여부
  sort_by_filename: true  # 파일명 숫자 순서로 정렬