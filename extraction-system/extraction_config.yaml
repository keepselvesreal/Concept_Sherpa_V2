# 추출 시스템 통합 설정 파일
# 기존 추출 작업 + 새로운 책 파이프라인 통합

# 기존 추출 작업 설정 (유튜브, 마크다운)
extraction:
  ai_provider: "claude"  # claude, gemini, openai
  
  fallback:
    max_attempts: 3
    retry_delay_base: 1.0  # 지수 백오프 기본값 (초)
    timeout_seconds: 30
    default_language: "korean"  # source_language 감지 실패 시 기본값
  
  tasks:
    core_content:
      enabled: true
      max_sentences: 3
    detailed_core_content:
      enabled: true
      max_words: 300
    detailed_content:
      enabled: true
      # max_words 제한 없음 - 자유로운 상세 내용 추출
    main_topics:
      enabled: true
      max_items: 5
    sub_topics:
      enabled: true
      max_items: 5

# AI 모델별 설정
providers:
  claude:
    max_turns: 1
    temperature: 0.7
    allowed_tools: []
  gemini:
    api_key_env: "GEMINI_API_KEY"
    model: "gemini-pro"
    temperature: 0.7
  openai:
    api_key_env: "OPENAI_API_KEY" 
    model: "gpt-4"
    temperature: 0.7

# 책 파이프라인 전용 설정 (PDF/EPUB → 통합 노드 문서)
book_pipeline:
  # 1단계: PDF 목차 추출 설정
  toc_extractor:
    ai_provider: "claude"  # 목차 추출은 정확성이 중요하므로 Claude 사용
    max_retries: 2  # 실패 시 재시도 횟수
    processing_mode: "hierarchical"  # 계층 구조 처리 모드
    
  # 2단계: 장별 폴더 생성 설정  
  chapter_extractor:
    ai_provider: "gemini"  # 빠른 분류 작업에 적합
    temperature: 0.5  # 균형있는 온도 설정
    max_retries: 3
    batch_processing: true  # 배치 처리 활성화
    
  # 전역 설정
  global:
    output_base_dir: "./book_outputs"  # 책 파이프라인 출력 기본 경로
    temp_cleanup: true  # 임시 파일 자동 정리
    create_backup: false  # 백업 파일 생성 여부
    
  # 처리 옵션
  processing:
    parallel_chapters: false  # 장별 병렬 처리 (메모리 사용량 고려)
    max_chapter_size_mb: 50  # 장별 최대 크기 제한 (MB)
    extract_images: false  # 이미지 추출 여부 (1단계에서는 비활성화)