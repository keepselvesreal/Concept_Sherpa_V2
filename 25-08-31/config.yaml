# 통합 노드 처리 시스템 설정 파일
# AI 제공자 설정 (기존 방식과 신규 방식 모두 지원)
ai_provider: 'gemini'  # 전역 기본값
processing_mode: 'v3'  # v1, v2, v3 선택

# 스크립트별 개별 설정
script_configs:
  content_node_extractor:
    ai_provider: 'claude'  # 이 스크립트는 Claude 사용
    temperature: 0.5
  extract_chapters_v2:
    ai_provider: 'gemini'  # 이 스크립트는 Gemini 사용
    temperature: 0.7
nodes_json_path: '../25-08-31/ch1/1 Complexity of object- oriented programming.json'
node_docs_dir: '../25-08-31/node_docs'
debug_dir: '../25-08-31'

# 병렬 처리 설정
parallel:
  max_concurrent: 3

# 로깅 설정
logging:
  level: 'INFO'
  save_logs: true

# AI 모델 설정
models:
  claude: "claude-3-sonnet-20240229"  # CLI 인증 (Max Plan)
  gemini: "gemini-2.0-flash-exp"      # API 키 (.env에서 GEMINI_API_KEY)
  openai: "gpt-4"

# 프로바이더별 상세 설정 (기존 방식 호환)
providers:
  gemini:
    model: 'models/gemini-2.0-flash-lite'
    temperature: 0.7
  claude:
    model: 'claude-3-sonnet'
  openai:
    model: 'gpt-4'
    temperature: 0.7

# 출력 설정 (기존 용도)
output:
  directory: "chapters"
  clean_before_run: true