# 생성 시간: 2025-08-28 20:26:01 KST
# 핵심 내용: 통합 노드 처리 시스템 설정 파일
# 상세 내용:
#   - ai_provider: AI 프로바이더 설정 (gemini, claude, openai)
#   - processing_mode: 작업 방식 설정 (v1, v2, v3)
#   - extraction: 추출 작업 설정
#   - update: 업데이트 작업 설정
#   - recovery: 오류 복구 설정
#   - progress: 진행률 추적 설정
# 상태: active
# 주소: config/unified_node_processor
# 참조: extraction_config.yaml

# 기본 설정
ai_provider: "gemini"  # gemini, claude, openai
processing_mode: "v3"  # v1, v2, v3

# 파일 경로
nodes_json_path: "./process/nodes_updated.json"
node_docs_dir: "./process/node_docs"

# 병렬 처리 설정
parallel:
  max_concurrent: 5

# 로깅 설정
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  
# AI 프로바이더별 설정
providers:
  gemini:
    api_key_env: "GEMINI_API_KEY"
    model: "models/gemini-2.0-flash-lite"
    temperature: 0.7
    max_retries: 3
    timeout: 30
    
  claude:
    max_turns: 1
    temperature: 0.7
    allowed_tools: []
    timeout: 30
    
  openai:
    api_key_env: "OPENAI_API_KEY"
    model: "gpt-4"
    temperature: 0.7
    max_tokens: 2000
    timeout: 30

# 추출 작업 설정
extraction:
  tasks:
    core_content:
      enabled: true
      max_sentences: 3
    detailed_core_content:
      enabled: true
      max_words: 300
    detailed_content:
      enabled: true
      # 새로 추가된 정보 타입 - 상세 정보
    main_topics:
      enabled: true
      max_items: 5
    sub_topics:
      enabled: true
      max_items: 5

# 업데이트 작업 설정
update:
  parent_update:
    # 부모 노드 업데이트 시 모든 5개 정보 타입 처리
    update_all_sections: true
    include_source_attribution: true
    
  children_update:
    # 자식 노드 업데이트 시 3개 정보만 처리 (주요/부차 화제 제외)
    update_sections: ["core_content", "detailed_core_content", "detailed_content"]

# 오류 복구 설정
recovery:
  max_attempts: 3
  retry_delay_base: 1.0  # 지수 백오프 기본값 (초)
  timeout_seconds: 30
  auto_rollback: true
  backup_enabled: true

# 진행률 추적 설정
progress:
  show_progress_bar: true
  log_interval: 10  # 몇 개 노드마다 진행률 출력
  save_checkpoint: true
  checkpoint_interval: 50  # 몇 개 노드마다 체크포인트 저장